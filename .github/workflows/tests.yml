name: tests

# The merge gate for this repository is the `ci-gate` job at the bottom of this
# file, referenced by name from the default-branch ruleset. Read that job first:
# everything above it exists to give it something to aggregate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  double-green:
    # Matrix leg names embed the matrix values, so this name is NOT the one the
    # ruleset references -- see `ci-gate`.
    name: double-green (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # 40, not 20, and the number is measured rather than guessed. This job runs
    # the whole suite TWICE (that is what double-green means), and the Windows
    # cells are an order of magnitude slower than the Linux ones on the same
    # commit: on `d44bd14` the ubuntu cells finished in ~1 minute each and
    # windows node 24 took 15m31s. At a 20-minute cap that cell was already at
    # 78% with the port less than half ported, and the first belt to add a few
    # cases to it was cancelled mid-second-run -- which surfaces as `ci-gate`
    # failing on a `cancelled` result rather than as anything a log explains.
    #
    # The cost *was* per-test SQLite: nearly every case built a migrated
    # production control plane, and that is far worse on Windows file I/O than
    # locally. The fix this comment used to name as pending has since landed --
    # a suite-scoped temporary directory (`D-0025`) with `suiteTemplate` over it
    # (`D-0033`), which migrates one plane per *file* and hands each case a copy.
    # Measured on one Linux box: 70.4ms to migrate a plane against 0.45ms to
    # copy one, N=30. The testkit freeze that blocked it is over.
    #
    # With that adopted everywhere it applies, the suite migrates 170 planes per
    # run rather than 357 (37.5s of SQLite down to 17.8s, one Linux box,
    # `suite-runs-unchanged` excluded so its nested runs are not counted twice).
    # The 170 that remain are the ones that have to migrate: `migrator.test.ts`
    # and `db-cli.test.ts` have migration itself under test, `lap/cli.test.ts`
    # builds its fixture by driving the real `db create` verb, and the endpoint
    # cases hand the migrator a wall-clock instant a fixed template cannot carry.
    #
    # So this cap is no longer waiting on that change. The sentence that used to
    # stand here -- that child processes rather than SQLite dominate the
    # remaining wall clock -- was true of the Linux measurement it cited and is
    # NOT true of the Windows cell, which is the one that sets the wait. Measured
    # per file against ubuntu on the same commit, the Windows excess is
    # concentrated in files that never spawn anything (`canary/audit.test.ts`
    # 1.4s -> 87.9s), and removing durability takes those to 4-7% of their time.
    # `docs/windows-ci-cost.md` holds the numbers, both halves of the split, and
    # the candidates; read it before tuning anything here. The cap stays where
    # D-1103 measured it for the reason below; it is not tuned to hide anything.
    #
    # 65 on Windows, not 40 (D-1103). The same slide happened again: run
    # 33781360734 (continuo#114, 2026-09-03) finished `windows-latest, node 24`
    # in 23m12s -- 1.6x headroom under a 40-minute cap -- and cancelled
    # `windows-latest, node 22` mid-second-lap when it ran out of wall clock
    # first, which is `ci-gate` failing on a `cancelled` result again rather
    # than a log explaining anything. 65 minutes clears 2x over both that
    # measurement and D-0052's older job-level max (1864s); ubuntu is
    # untouched: both its cells stay inside the same cap they always ran
    # comfortably inside (single digit minutes), and the Windows/Linux split
    # keeps this a one-line expression on one job-level key rather than two
    # jobs or a `matrix.include` block, so the seed derivation above (per-cell,
    # keyed on `matrix.os`/`matrix.node`) stays exactly as it is.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 65 || 40 }}
    strategy:
      # A red cell must not hide the state of the others: which cells failed is
      # the diagnosis, and cancelling them destroys it.
      fail-fast: false
      matrix:
        # Windows is a required cell from day one, not a nightly extra. The
        # cp932 console is where the ASCII-only output policy is actually
        # observed (docs/cli-output-policy.md, D-0006).
        os: [ubuntu-latest, windows-latest]
        # Node 22 (Maintenance LTS) and Node 24 (Active LTS). Node 26 Current is
        # deliberately absent from the required set (D-0003).
        node: ["22", "24"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install from the lockfile
        # `npm ci`, never `npm install`: it fails when package.json and
        # package-lock.json disagree, so a dependency cannot drift into a run
        # without appearing in a diff.
        #
        # `--ignore-scripts` is load-bearing, not a hardening flourish (D-0009).
        # better-sqlite3 v13 ships no install script, so npm falls back to its
        # default for a package containing binding.gyp and runs `node-gyp
        # rebuild`. That build produces nothing -- binding.gyp detects the
        # bundled prebuilt binary and emits an empty target -- but node-gyp must
        # still *configure* first, which needs a working MSVC toolchain. On the
        # windows-latest / node 22 cell it does not find one and the install
        # fails outright.
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npm run typecheck

      - name: Native addon load smoke
        # Runs before the suite: a native addon that fails to load also breaks
        # the runner's worker bootstrap, and the runner's error names workers
        # rather than SQLite. This step makes the log name the real cause.
        run: npm run smoke:native

      - name: Put the suite's temporary files on the runner's local disk
        # Windows only, and the largest single thing measured about this cell.
        #
        # `test/helpers/tmp.ts` creates every test database under
        # `os.tmpdir()`, which on the windows-latest image resolves to
        # `C:\Users\RUNNER~1\AppData\Local\Temp` -- the network-attached OS
        # disk -- while the workspace is checked out onto `D:`, the local
        # ephemeral SSD. Measured in one job with nothing else varying
        # (`docs/windows-ci-cost.md` 5a): one commit under the control plane's
        # rollback journal costs 15.60ms on `C:` and 1.14ms on `D:`, and the
        # nine heaviest files go from 129.24s to 43.78s of test time. A plain
        # file create-and-delete moves only 1.6x over the same pair, so what
        # `C:` is slow at is fsync, which is what `synchronous = FULL` (D-0012)
        # spends its time on.
        #
        # This is the reason to prefer it over every other candidate: it moves
        # a temporary directory. No durability claim, journal mode, timeout or
        # test changes, and on the same measurement it beats abandoning
        # durability outright (43.78s here against 70.9s at
        # `synchronous = OFF` on `C:`).
        #
        # Written into the environment rather than set on the two suite steps
        # so that one edit cannot move one run and not the other. Both names
        # are set because Node's `os.tmpdir()` reads TEMP before TMP on win32
        # and the choice should not depend on which one the image happens to
        # define.
        #
        # ubuntu is untouched -- not by an `if:` on the value, but because the
        # step itself does not run there. That matters: on POSIX `os.tmpdir()`
        # falls back to TMP and TEMP after TMPDIR, so setting these globally
        # would quietly move the Linux cells too, which nothing here has
        # measured.
        if: ${{ matrix.os == 'windows-latest' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "suite temporary directory -> $RUNNER_TEMP"

      - name: Derive two distinct seeds for this cell
        id: seeds
        shell: bash
        run: |
          set -euo pipefail
          # Derived from the run id, the attempt, and the cell coordinates, so
          # that (a) every cell uses different seeds, (b) a re-run of the same
          # commit exercises different orders rather than replaying the one that
          # happened to be green, and (c) both seeds are printed and therefore
          # replayable.
          cell="${{ matrix.os }}-${{ matrix.node }}"
          mix=$(printf '%s' "$cell" | cksum | cut -d' ' -f1)
          run_id="${{ github.run_id }}"
          attempt="${{ github.run_attempt }}"
          seed_a=$(( (run_id + mix + attempt * 7919) % 2147483647 ))
          seed_b=$(( (seed_a * 31 + 1013904223) % 2147483647 ))
          # The rule is *distinct* seeds. Equality is astronomically unlikely and
          # is still handled, because "two runs at the same seed" is precisely
          # the degenerate case that would void the double-green guarantee.
          if [ "$seed_a" -eq "$seed_b" ]; then
            seed_b=$(( (seed_b + 1) % 2147483647 ))
          fi
          echo "seed_a=$seed_a" >> "$GITHUB_OUTPUT"
          echo "seed_b=$seed_b" >> "$GITHUB_OUTPUT"
          echo "cell=$cell seed_a=$seed_a seed_b=$seed_b"

      - name: Green 1 of 2 (seed ${{ steps.seeds.outputs.seed_a }})
        env:
          CONTINUO_TEST_SEED: ${{ steps.seeds.outputs.seed_a }}
        # Shuffle itself is configured in vitest.config.ts and is NOT passed on
        # the command line: a CLI flag can be dropped by an edit to this file
        # without any test turning red, which would silently retire the rule.
        # CI injects the seed and nothing else.
        run: npm test

      - name: Green 2 of 2 (seed ${{ steps.seeds.outputs.seed_b }})
        # No `if:` guard -- this step is reached only when the first run passed,
        # which is the serial half of the rule. Two green runs at two distinct
        # seeds in the same cell is what "green twice under random ordering"
        # means here.
        env:
          CONTINUO_TEST_SEED: ${{ steps.seeds.outputs.seed_b }}
        run: npm test

      - name: Build the distribution
        run: npm run build

  lint:
    # Lint and format are platform-independent text checks (D-0010), so one
    # cell is enough; running them in every matrix cell would only multiply an
    # identical answer. The result still gates the merge -- see `ci-gate`.
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install from the lockfile
        # Same posture as the matrix cells: `npm ci` against the lockfile, and
        # `--ignore-scripts` is load-bearing (D-0009).
        run: npm ci --ignore-scripts

      - name: Lint, format, and import order (Biome)
        run: npm run lint

  package:
    # Package-quality checks (D-0011): publint and attw inspect the packed
    # tarball's metadata and type resolution, knip sweeps for unused exports
    # and dependencies. All three are platform-independent, so one cell is
    # enough (same reasoning as `lint`); the result still gates the merge via
    # `ci-gate`, and the ruleset references no new check name.
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install from the lockfile
        # Same posture as the matrix cells: `npm ci` against the lockfile, and
        # `--ignore-scripts` is load-bearing (D-0009).
        run: npm ci --ignore-scripts

      - name: Unused exports and dependencies (knip)
        # Before the build: knip reads sources, not dist/, and failing the
        # cheap check first mirrors verify's ordering.
        run: npm run knip

      - name: Build the distribution
        # publint and attw lint the *built* package; without dist/ they would
        # be reporting on an empty tarball.
        run: npm run build

      - name: Package metadata and exports (publint)
        run: npm run publint

      - name: Type resolution per module mode (attw)
        run: npm run attw

  parity:
    # The parity ledger's enforcement, and the source inventory's
    # (docs/test-translation-conventions.md). A ledger nobody checks is a
    # spreadsheet, and so is an inventory: this job is what makes a missing
    # mapping, a duplicated one, an unaccounted target test, an unapproved skip,
    # a shrinking case count, or an inventory that no longer reconciles with
    # interlock's suite baseline turn the merge gate red.
    #
    # Platform-independent, so one cell is enough (same reasoning as `lint`).
    # It runs `vitest list`, not the suite, so it is cheap and does not
    # duplicate `double-green`.
    name: parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install from the lockfile
        # Same posture as the matrix cells: `npm ci` against the lockfile, and
        # `--ignore-scripts` is load-bearing (D-0009).
        run: npm ci --ignore-scripts

      - name: Parity ledger check
        run: npm run parity

      - name: Source inventory check
        # The other half, and the one no ledger reaches: `parity` verifies the
        # inventories a ledger points at, so a subsystem nobody has started
        # porting is checked by nothing until the belt that ports it opens the
        # files -- months later, with the breaking diff long gone.
        run: npm run inventory

  ci-gate:
    # THE REQUIRED CHECK. The default-branch ruleset references this literal
    # name and no other. Matrix leg names embed their matrix values, so making
    # them required means that adding or renaming a cell silently changes the
    # set of contexts -- protection that moves when the matrix moves.
    name: ci-gate
    runs-on: ubuntu-latest
    needs: [double-green, lint, package, parity]
    # Without `always()` this job is SKIPPED when an upstream job fails, and
    # GitHub reports a skipped required check as success. That is an open gate.
    if: ${{ always() }}
    steps:
      - name: Fail unless every required cell was green twice
        env:
          DOUBLE_GREEN_RESULT: ${{ needs.double-green.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          PARITY_RESULT: ${{ needs.parity.result }}
        shell: bash
        run: |
          set -euo pipefail
          echo "double-green: ${DOUBLE_GREEN_RESULT}"
          echo "lint: ${LINT_RESULT}"
          echo "package: ${PACKAGE_RESULT}"
          echo "parity: ${PARITY_RESULT}"
          # Allow-list, not a deny-list: `!= 'failure'` would let `cancelled`
          # and `skipped` through. Only 'success' opens the gate.
          if [ "${DOUBLE_GREEN_RESULT}" != "success" ]; then
            echo "::error::Required cells did not all pass twice under random ordering."
            exit 1
          fi
          if [ "${LINT_RESULT}" != "success" ]; then
            echo "::error::Lint did not pass."
            exit 1
          fi
          if [ "${PACKAGE_RESULT}" != "success" ]; then
            echo "::error::Package-quality checks (publint, attw, knip) did not pass."
            exit 1
          fi
          if [ "${PARITY_RESULT}" != "success" ]; then
            echo "::error::The parity ledger or source inventory check did not pass."
            exit 1
          fi

      - name: Guard against an unreported dependency
        # Belt and braces. That `needs.<job>.result` aggregates every leg of a
        # matrix is long-observed runner behaviour rather than a documented
        # guarantee, so the gate also refuses any non-success value anywhere in
        # `needs.*`.
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::A required job failed, was cancelled, or was skipped."
          exit 1
